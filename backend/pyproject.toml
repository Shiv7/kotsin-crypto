[project]
name = "kotsin-crypto"
version = "0.1.0"
description = "Personal crypto trading engine for Delta Exchange India — one asyncio process, zero dependency on the Kotsin NSE stack."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pyarrow>=17",
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=2.0",
    "structlog>=24",
    "anthropic>=1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "import-linter>=2",
]

[project.scripts]
kotsin-crypto = "kotsin_crypto.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kotsin_crypto"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "live: hits Delta's public API over the network (select with -m live)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
# E501: the formatter wraps code; prose in docstrings may run long. RUF001-3: typographic characters in prose are deliberate.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.importlinter]
root_package = "kotsin_crypto"

[[tool.importlinter.contracts]]
name = "strategy is pure: no venue / exec / ledger / api / ops / feed imports"
type = "forbidden"
source_modules = ["kotsin_crypto.strategy"]
forbidden_modules = [
    "kotsin_crypto.venue",
    "kotsin_crypto.exec",
    "kotsin_crypto.ledger",
    "kotsin_crypto.api",
    "kotsin_crypto.ops",
    "kotsin_crypto.feed",
]

[[tool.importlinter.contracts]]
name = "exec does not import strategy"
type = "forbidden"
source_modules = ["kotsin_crypto.exec"]
forbidden_modules = ["kotsin_crypto.strategy"]

[[tool.importlinter.contracts]]
name = "venue is a leaf"
type = "forbidden"
source_modules = ["kotsin_crypto.venue"]
forbidden_modules = [
    "kotsin_crypto.strategy",
    "kotsin_crypto.risk",
    "kotsin_crypto.exec",
    "kotsin_crypto.ledger",
    "kotsin_crypto.api",
    "kotsin_crypto.bars",
    "kotsin_crypto.feed",
]
